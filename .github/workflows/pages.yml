# Pubblica il sito su GitHub Pages a ogni push su master.
# Copia solo i file del sito (niente src/, package.json, README, AGENTS.md).
name: Pubblica sito

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara i file da pubblicare
        run: |
          mkdir _site
          cp *.html sitemap.xml robots.txt CNAME LICENSE _site/
          cp -r assets data museo pdf _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
